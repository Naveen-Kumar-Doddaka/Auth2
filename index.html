<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account - Custom Digital Art Commissions</title>

<!-- External CSS File -->
<link rel="stylesheet" href="Auth.css">

</head>
<body>

<!-- HEADER -->
<header>
    <div class="logo">Custom Digital Art Commissions</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="order.html">Order</a>
        <a href="auth.html">Account</a>
    </nav>
</header>

<!-- AUTH SECTION -->
<div class="auth-container">
    <div class="auth-box">

        <!-- Tabs -->
        <div class="auth-tabs">
            <button id="loginTab" class="active">Login</button>
            <button id="signupTab">Sign Up</button>
        </div>

        <!-- LOGIN FORM -->
        <div id="loginForm" class="form-section active">
            <form>
                <input type="email" placeholder="Email Address" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>

        <!-- SIGNUP FORM -->
        <div id="signupForm" class="form-section">
            <form enctype="multipart/form-data">
                <input type="text" placeholder="Full Name" required>
                <input type="tel" placeholder="Mobile Number" required>
                <input type="email" placeholder="Email Address" required>
                <input type="email" placeholder="Confirm Email" required>
                <textarea rows="3" placeholder="Address" required></textarea>
                <input type="file" accept="image/*">
                <input type="password" placeholder="Create Password" required>
                <input type="password" placeholder="Confirm Password" required>
                <button type="submit">Create Account</button>
            </form>
        </div>

    </div>
</div>

<!-- FOOTER -->
<footer>
    © 2024 Custom Digital Art Commissions. All Rights Reserved.
</footer>

<!-- JavaScript Toggle -->
<script>
const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");
const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");

loginTab.addEventListener("click", () => {
    loginTab.classList.add("active");
    signupTab.classList.remove("active");
    loginForm.classList.add("active");
    signupForm.classList.remove("active");
});

signupTab.addEventListener("click", () => {
    signupTab.classList.add("active");
    loginTab.classList.remove("active");
    signupForm.classList.add("active");
    loginForm.classList.remove("active");
});
</script>

</body>
</html>
